{% extends "base.html" %}

{% block title %}Detalhe do Aluno{% endblock %}

{% block content %}
<h2>{{ aluno.nome }}</h2>
<p>Matrícula: {{ aluno.matricula }}</p>
<p>Criado em: {{ aluno.criado_em }}</p>
<a href="{% url 'aluno_update' aluno.pk %}">Editar</a>
<a href="{% url 'aluno_delete' aluno.pk %}">Excluir</a>
<a href="{% url 'lista_alunos' %}">Voltar à lista</a>
{% endblock %}
