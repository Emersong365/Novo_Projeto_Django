{% extends "base.html" %}

{% block title %}Lista de Alunos{% endblock %}

{% block content %}
<h2>Alunos Cadastrados</h2>
<ul>
    {% for aluno in alunos %}
        <li>
            {{ aluno.nome }} - {{ aluno.matricula }}
            <a href="{% url 'aluno_detalhe' aluno.pk %}">Ver</a>
            <a href="{% url 'aluno_update' aluno.pk %}">Editar</a>
            <a href="{% url 'aluno_delete' aluno.pk %}">Excluir</a>
        </li>
    {% empty %}
        <li>Nenhum aluno cadastrado.</li>
    {% endfor %}
</ul>
{% endblock %}
